name: 24h Discord Webhook

on:
  schedule:
    # 매일 한국 시간(KST) 낮 12시 00분
    # UTC 03:00 = KST 12:00
    - cron: '0 3 * * *'

  workflow_dispatch:
    inputs:
      target_server:
        description: '어느 서버로 보낼지 선택하세요'
        required: true
        type: choice
        options:
          - 리자몽 서버
          - 테스트 서버
          - 보조 서버

      custom_message:
        description: '수동으로 보낼 메시지를 입력하세요 (비워두면 자동 발송 문구가 나옵니다)'
        required: false
        type: string

jobs:
  send_message:
    runs-on: ubuntu-latest

    steps:
      - name: Send Webhook
        env:
          WEBHOOK_URL_1: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          WEBHOOK_URL_3: ${{ secrets.DISCORD_WEBHOOK_URL_3 }}
          SELECTED_SERVER: ${{ github.event.inputs.target_server }}
          INPUT_MSG: ${{ github.event.inputs.custom_message }}
        run: |
          if [ -z "$SELECTED_SERVER" ]; then
            WEBHOOK_URL="$WEBHOOK_URL_1"
          elif [ "$SELECTED_SERVER" = "리자몽 서버" ]; then
            WEBHOOK_URL="$WEBHOOK_URL_1"
          elif [ "$SELECTED_SERVER" = "테스트 서버" ]; then
            WEBHOOK_URL="$WEBHOOK_URL_2"
          elif [ "$SELECTED_SERVER" = "보조 서버" ]; then
            WEBHOOK_URL="$WEBHOOK_URL_3"
          else
            echo "Unknown target server: $SELECTED_SERVER"
            exit 1
          fi

          if [ -z "$WEBHOOK_URL" ]; then
            echo "WEBHOOK_URL is empty"
            exit 1
          fi

          if [ -z "$INPUT_MSG" ]; then
            MSG="🔥 최저가 보장! 발로란트 전문 no.1 리자드팀입니다!! 🔥\n🎮 가격 부담 없이 가장 저렴하게 티어 올리고 싶다면? \n 💰 타샵 비교 불가!업계 최저가 단가로 티어 수직 상승! \n ⚡ 빠른 티켓 응대와 베테랑 기사진의 압도적인 승률 & 신속 작업 \n 🛡️ 100% 철저한 비밀 유지와 완벽한 안전 보장까지! 지금 바로 리자몽몰 티켓 오픈하고 견적 문의하세요! 👉 "
          else
            MSG="$INPUT_MSG"
          fi

          # \n을 실제 줄바꿈으로 변환
          MESSAGE=$(printf '%b' "$MSG")

          # JSON 안전하게 생성 후 Discord 웹훅으로 전송
          response=$(jq -n \
            --arg content "$MESSAGE" \
            '{
              content: $content,
              allowed_mentions: {
                parse: []
              }
            }' \
            | curl -s -o /tmp/resp.txt -w "%{http_code}" \
                -H "Content-Type: application/json" \
                -X POST \
                --data-binary @- \
                "$WEBHOOK_URL")

          if [ "$response" != "204" ]; then
            echo "Discord webhook failed with HTTP $response"
            cat /tmp/resp.txt
            exit 1
          fi
