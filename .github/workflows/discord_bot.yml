name: 24h Discord Webhook

on:
  schedule:
    # 매일 한국 시간(KST) 낮 12:00
    # GitHub Actions cron은 UTC 기준 → 03:00 UTC = 12:00 KST
    - cron: '0 3 * * *'

  workflow_dispatch:
    inputs:
      custom_message:
        description: '수동으로 보낼 메시지를 입력하세요 (비워두면 자동 문구가 전송됩니다)'
        required: false
        type: string

jobs:
  send_message:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Webhook
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INPUT_MSG: ${{ github.event.inputs.custom_message }}
        run: |
          # 수동 입력이 없으면 기본 메시지 사용
          if [ -z "$INPUT_MSG" ]; then
            MSG='🔥 최저가 보장! 발로란트 전문 리자몽몰입니다!! 🔥
🎮 가격 부담 없이 가장 저렴하게 티어 올리고 싶다면?
💰 타샵 비교 불가! 업계 최저가 단가로 티어 수직 상승!
⚡ 빠른 티켓 응대와 베테랑 기사진의 압도적인 승률 & 신속 작업
🛡️ 100% 철저한 비밀 유지와 완벽한 안전 보장까지!
지금 바로 리자몽몰 티켓 오픈하고 견적 문의하세요!
👉 https://discord.gg/XphRmaXnVK

@everyone'
          else
            MSG="$INPUT_MSG"
          fi

          # Python으로 JSON을 안전하게 생성
          # 줄바꿈, 따옴표, 이모지 등이 있어도 JSON이 깨지지 않음
          python3 - "$MSG" "$WEBHOOK_URL" <<'PY'
          import json
          import sys
          import urllib.request

          message = sys.argv[1]
          webhook_url = sys.argv[2]

          data = {
              "content": message,
              "allowed_mentions": {
                  "parse": ["everyone"]
              }
          }

          payload = json.dumps(data, ensure_ascii=False).encode("utf-8")

          request = urllib.request.Request(
              webhook_url,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print(f"Discord 응답 코드: {response.status}")
PY
