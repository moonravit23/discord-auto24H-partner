name: Discord Webhook

on:
  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:
    inputs:
      target_server:
        description: '어느 서버로 보낼지 선택하세요'
        required: true
        type: choice
        options:
          - 러브스댈구
          - 발로몰
          - 보조 서버
          - 발로 랜계no.1
          - 니트로
          - 04디스코드

      custom_message:
        description: '보낼 메시지를 입력하세요'
        required: false
        type: string

jobs:
  send_message:
    runs-on: ubuntu-latest

    steps:
      - name: Send Webhook
        env:
          WEBHOOK_URL_1: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          WEBHOOK_URL_3: ${{ secrets.DISCORD_WEBHOOK_URL_3 }}
          WEBHOOK_URL_4: ${{ secrets.DISCORD_WEBHOOK_URL_4 }}
          WEBHOOK_URL_5: ${{ secrets.DISCORD_WEBHOOK_URL_5 }}
          WEBHOOK_URL_6: ${{ secrets.DISCORD_WEBHOOK_URL_6 }}
          SELECTED_SERVER: ${{ inputs.target_server }}
          INPUT_MSG: ${{ inputs.custom_message }}

        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            MSG="🔥 최저가 보장! 발로란트 전문 리자몽몰입니다!\n🎮 가격 부담 없이 가장 저렴하게 티어 올리고 싶다면?\n💰 타샵 비교 불가! 업계 최저가 단가로 티어 수직 상승!\n⚡ 빠른 티켓 응대와 베테랑 기사진의 압도적인 승률 & 신속 작업\n🛡️ 100% 철저한 비밀 유지와 완벽한 안전 보장까지!\n지금 바로 리자몽몰 티켓 오픈하고 견적 문의하세요!\n👉 https://discord.gg/ASrvjw4dNT\n||@everyone||"

            WEBHOOK_URLS=("$WEBHOOK_URL_1" "$WEBHOOK_URL_2" "$WEBHOOK_URL_3" "$WEBHOOK_URL_4" "$WEBHOOK_URL_5" "$WEBHOOK_URL_6")
          else
            if [ "$SELECTED_SERVER" = "러브스댈구" ]; then
              WEBHOOK_URL="$WEBHOOK_URL_1"
            elif [ "$SELECTED_SERVER" = "발로몰" ]; then
              WEBHOOK_URL="$WEBHOOK_URL_2"
            elif [ "$SELECTED_SERVER" = "보조 서버" ]; then
              WEBHOOK_URL="$WEBHOOK_URL_3"
            elif [ "$SELECTED_SERVER" = "발로 랜계no.1" ]; then
              WEBHOOK_URL="$WEBHOOK_URL_4"
            elif [ "$SELECTED_SERVER" = "니트로" ]; then
              WEBHOOK_URL="$WEBHOOK_URL_5"
            elif [ "$SELECTED_SERVER" = "04디스코드" ]; then
              WEBHOOK_URL="$WEBHOOK_URL_6"
            else
              echo "Unknown target server: $SELECTED_SERVER"
              exit 1
            fi
            if [ -z "$INPUT_MSG" ]; then
              MSG="테스트 메시지입니다.\nDiscord 웹훅 정상 작동 확인!"
            else
              MSG="$INPUT_MSG"
            fi
            WEBHOOK_URLS=("$WEBHOOK_URL")
          fi

          MESSAGE=$(printf '%b' "$MSG")
          failed=0
          for WEBHOOK_URL in "${WEBHOOK_URLS[@]}"; do
            if [ -z "$WEBHOOK_URL" ]; then
              echo "A Discord webhook URL is empty"
              failed=1
              continue
            fi
            response=$(jq -n \
              --arg content "$MESSAGE" \
              '{
                content: $content,
                allowed_mentions: {
                  parse: ["everyone"]
                }
              }' \
              | curl -sS -o /tmp/resp.txt -w "%{http_code}" \
                  -H "Content-Type: application/json" \
                  -X POST \
                  --data-binary @- \
                  "$WEBHOOK_URL")
            if [ "$response" != "204" ]; then
              echo "Discord webhook failed with HTTP $response"
              cat /tmp/resp.txt
              failed=1
            else
              echo "Discord webhook sent successfully!"
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi