name: Discord Webhook

on:
  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:
    inputs:
      target_server:
        description: '어느 서버로 보낼지 선택하세요'
        required: true
        type: choice
        options:
          - 러브스댈구
          - 발로몰
          - 보조 서버
          - 발로 랜계no.1
          - 니트로
          - 04디스코드

      custom_message:
        description: '보낼 메시지를 입력하세요'
        required: false
        type: string

jobs:
  send_message:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Webhook
        env:
          WEBHOOK_URL_1: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          WEBHOOK_URL_3: ${{ secrets.DISCORD_WEBHOOK_URL_3 }}
          WEBHOOK_URL_4: ${{ secrets.DISCORD_WEBHOOK_URL_4 }}
          WEBHOOK_URL_5: ${{ secrets.DISCORD_WEBHOOK_URL_5 }}
          WEBHOOK_URL_6: ${{ secrets.DISCORD_WEBHOOK_URL_6 }}
          SELECTED_SERVER: ${{ inputs.target_server }}
          INPUT_MSG: ${{ inputs.custom_message }}

        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            MSG=$'⚡ XENIX CHEAT — 압도적인 퍼포먼스\n\n━━━━━━━━━━━━━━━━━━━━\n\n🚀 차원이 다른 성능, 압도적인 퍼포먼스\n💎 타협 없는 퀄리티와 안정성\n🔥 디테일 하나까지 놓치지 않는 완성도\n\n단순한 기능을 넘어, 성능과 퀄리티의 차이를 보여드립니다.\n끊임없는 개발과 개선을 통해 더 나은 경험을 추구합니다.\n\n성능으로 증명하고, 퀄리티로 차별화하다.\n\n👑 XENIX CHEAT\nBUILT FOR PERFORMANCE. DEFINED BY QUALITY.\nhttps://discord.gg/QeQyu99aPW\n@everyone'
            WEBHOOK_URLS=("$WEBHOOK_URL_1" "$WEBHOOK_URL_2" "$WEBHOOK_URL_3" "$WEBHOOK_URL_4" "$WEBHOOK_URL_5" "$WEBHOOK_URL_6")
          else
            case "${SELECTED_SERVER}" in
              "러브스댈구") WEBHOOK_URL="$WEBHOOK_URL_1" ;;
              "발로몰") WEBHOOK_URL="$WEBHOOK_URL_2" ;;
              "보조 서버") WEBHOOK_URL="$WEBHOOK_URL_3" ;;
              "발로 랜계no.1") WEBHOOK_URL="$WEBHOOK_URL_4" ;;
              "니트로") WEBHOOK_URL="$WEBHOOK_URL_5" ;;
              "04디스코드") WEBHOOK_URL="$WEBHOOK_URL_6" ;;
              *)
                echo "Unknown target server: ${SELECTED_SERVER}"
                exit 1
                ;;
            esac

            if [ -n "${INPUT_MSG:-}" ]; then
              MSG="${INPUT_MSG}"
            else
              MSG=$'⚡ XENIX CHEAT — 압도적인 퍼포먼스\n\n━━━━━━━━━━━━━━━━━━━━\n\n🚀 차원이 다른 성능, 압도적인 퍼포먼스\n💎 타협 없는 퀄리티와 안정성\n🔥 디테일 하나까지 놓치지 않는 완성도\n\n단순한 기능을 넘어, 성능과 퀄리티의 차이를 보여드립니다.\n끊임없는 개발과 개선을 통해 더 나은 경험을 추구합니다.\n\n성능으로 증명하고, 퀄리티로 차별화하다.\n\n👑 XENIX CHEAT\nBUILT FOR PERFORMANCE. DEFINED BY QUALITY.\nhttps://discord.gg/QeQyu99aPW\n@everyone'
            fi

            WEBHOOK_URLS=("$WEBHOOK_URL")
          fi

          failed=0
          valid_urls=()

          for WEBHOOK_URL in "${WEBHOOK_URLS[@]}"; do
            if [ -z "$WEBHOOK_URL" ]; then
              echo "Skipping empty webhook URL"
              continue
            fi
            if [[ "$WEBHOOK_URL" != https://*discord.com/api/webhooks/* && "$WEBHOOK_URL" != https://*discordapp.com/api/webhooks/* ]]; then
              echo "Skipping invalid webhook URL format"
              continue
            fi
            valid_urls+=("$WEBHOOK_URL")
          done

          if [ ${#valid_urls[@]} -eq 0 ]; then
            echo "No valid webhook URLs were found. Check GitHub Secrets."
            exit 1
          fi

          for WEBHOOK_URL in "${valid_urls[@]}"; do
            MESSAGE=$(printf '%b' "$MSG")
            response=$(jq -n \
              --arg content "$MESSAGE" \
              '{
                content: $content,
                allowed_mentions: {
                  parse: ["everyone"]
                }
              }' \
              | curl -sS -o /tmp/resp.txt -w "%{http_code}" \
                  -H "Content-Type: application/json" \
                  -X POST \
                  --data-binary @- \
                  "$WEBHOOK_URL")

            if [ "$response" != "204" ]; then
              echo "Discord webhook failed with HTTP $response"
              cat /tmp/resp.txt
              failed=1
            else
              echo "Discord webhook sent successfully!"
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
