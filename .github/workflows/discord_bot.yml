```yaml
name: Discord Webhook

on:
  workflow_dispatch:
    inputs:
      target_server:
        description: '어느 서버로 보낼지 선택하세요'
        required: true
        type: choice
        options:
          - 리자몽 서버
          - 테스트 서버
          - 보조 서버
          - 발로 랜계no.1
          - 니트로

      custom_message:
        description: '보낼 메시지를 입력하세요'
        required: false
        type: string

jobs:
  send_message:
    runs-on: ubuntu-24.04

    steps:
      - name: Send Discord Webhook
        shell: bash
        env:
          WEBHOOK_URL_1: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          WEBHOOK_URL_3: ${{ secrets.DISCORD_WEBHOOK_URL_3 }}
          WEBHOOK_URL_4: ${{ secrets.DISCORD_WEBHOOK_URL_4 }}
          WEBHOOK_URL_5: ${{ secrets.DISCORD_WEBHOOK_URL_5 }}
          SELECTED_SERVER: ${{ inputs.target_server }}
          INPUT_MSG: ${{ inputs.custom_message }}

        run: |
          set -e

          echo "선택 서버: [$SELECTED_SERVER]"

          case "$SELECTED_SERVER" in
            "리자몽 서버")
              WEBHOOK_URL="$WEBHOOK_URL_1"
              ;;
            "테스트 서버")
              WEBHOOK_URL="$WEBHOOK_URL_2"
              ;;
            "보조 서버")
              WEBHOOK_URL="$WEBHOOK_URL_3"
              ;;
            "발로 랜계no.1")
              WEBHOOK_URL="$WEBHOOK_URL_4"
              ;;
            "니트로")
              WEBHOOK_URL="$WEBHOOK_URL_5"
              ;;
            *)
              echo "❌ 서버 선택 오류"
              exit 1
              ;;
          esac

          if [ -z "$WEBHOOK_URL" ]; then
            echo "❌ 선택한 서버의 Secret이 비어 있음"
            exit 1
          fi

          echo "✅ Webhook Secret 확인됨"

          if [ -z "$INPUT_MSG" ]; then
            MESSAGE="테스트 메시지입니다."
          else
            MESSAGE=$(printf '%b' "$INPUT_MSG")
          fi

          echo "보낼 메시지:"
          printf '%s\n' "$MESSAGE"

          # JSON 생성
          JSON=$(jq -n \
            --arg content "$MESSAGE" \
            '{content: $content}')

          echo "Discord로 전송 중..."

          HTTP_CODE=$(curl -sS \
            -o response.txt \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$JSON" \
            "$WEBHOOK_URL")

          echo "HTTP 상태 코드: $HTTP_CODE"

          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ 전송 성공"
          else
            echo "❌ 전송 실패"
            echo "Discord 응답:"
            cat response.txt
            exit 1
          fi
```
