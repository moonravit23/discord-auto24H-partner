```yaml
name: Discord Webhook

on:
  workflow_dispatch:
    inputs:
      target_server:
        description: '어느 서버로 보낼지 선택하세요'
        required: true
        type: choice
        options:
          - 리자몽 서버
          - 테스트 서버
          - 보조 서버
          - 발로 랜계no.1
          - 니트로

      custom_message:
        description: '보낼 메시지를 입력하세요'
        required: false
        type: string

jobs:
  send_message:
    runs-on: ubuntu-24.04

    steps:
      - name: Send Discord Webhook
        env:
          WEBHOOK_URL_1: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          WEBHOOK_URL_3: ${{ secrets.DISCORD_WEBHOOK_URL_3 }}
          WEBHOOK_URL_4: ${{ secrets.DISCORD_WEBHOOK_URL_4 }}
          WEBHOOK_URL_5: ${{ secrets.DISCORD_WEBHOOK_URL_5 }}

          SELECTED_SERVER: ${{ inputs.target_server }}
          INPUT_MSG: ${{ inputs.custom_message }}

        run: |
          echo "========================================"
          echo "Discord Webhook 시작"
          echo "선택된 서버: $SELECTED_SERVER"
          echo "========================================"

          # 서버별 웹훅 선택
          case "$SELECTED_SERVER" in
            "리자몽 서버")
              WEBHOOK_URL="$WEBHOOK_URL_1"
              ;;
            "테스트 서버")
              WEBHOOK_URL="$WEBHOOK_URL_2"
              ;;
            "보조 서버")
              WEBHOOK_URL="$WEBHOOK_URL_3"
              ;;
            "발로 랜계no.1")
              WEBHOOK_URL="$WEBHOOK_URL_4"
              ;;
            "니트로")
              WEBHOOK_URL="$WEBHOOK_URL_5"
              ;;
            *)
              echo "❌ 알 수 없는 서버입니다."
              exit 1
              ;;
          esac

          # 웹훅 존재 여부 확인
          if [ -z "$WEBHOOK_URL" ]; then
            echo "❌ 선택한 서버의 Webhook Secret이 비어 있습니다."
            echo "GitHub Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo "✅ Webhook URL 확인 완료"

          # 메시지 설정
          if [ -z "$INPUT_MSG" ]; then
            MESSAGE="테스트 메시지입니다.
Discord 웹훅 정상 작동 확인!"
          else
            # 입력한 \n을 실제 줄바꿈으로 변환
            MESSAGE=$(printf '%b' "$INPUT_MSG")
          fi

          echo "보낼 메시지:"
          printf '%s\n' "$MESSAGE"
          echo "========================================"

          # jq로 안전하게 JSON 생성
          PAYLOAD=$(jq -n \
            --arg content "$MESSAGE" \
            '{
              content: $content,
              allowed_mentions: {
                parse: ["everyone"]
              }
            }')

          echo "JSON 생성 완료"

          # Discord Webhook 전송
          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output /tmp/discord_response.txt \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$WEBHOOK_URL")

          echo "Discord HTTP 응답: $HTTP_CODE"

          # 성공
          if [ "$HTTP_CODE" = "204" ]; then
            echo "========================================"
            echo "✅ Discord 메시지 전송 성공!"
            echo "========================================"
            exit 0
          fi

          # 실패
          echo "========================================"
          echo "❌ Discord 메시지 전송 실패"
          echo "HTTP Code: $HTTP_CODE"
          echo "Discord Response:"
          cat /tmp/discord_response.txt
          echo ""
          echo "========================================"

          exit 1
```
