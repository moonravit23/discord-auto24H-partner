name: 24h Discord Webhook

on:
  schedule:
    # 매일 한국 시간(KST) 낮 12시 00분
    # UTC 03:00 = KST 12:00
    - cron: '0 3 * * *'

  workflow_dispatch:
    inputs:
      custom_message:
        description: '수동으로 보낼 메시지를 입력하세요 (비워두면 자동 발송 문구가 나갑니다)'
        required: false
        type: string

jobs:
  send_message:
    runs-on: ubuntu-latest

    steps:
      - name: Send Webhook
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INPUT_MSG: ${{ github.event.inputs.custom_message }}
        run: |
          if [ -z "$INPUT_MSG" ]; then
            MSG="🔥 최저가 보장! 발로란트 전문 리자몽몰입니다!! 🔥\n🎮 가격 부담 없이 가장 저렴하게 티어 올리고 싶다면?\n💰 타샵 비교 불가! 업계 최저가 단가로 티어 수직 상승!\n⚡ 빠른 티켓 응대와 베테랑 기사진의 압도적인 승률 & 신속 작업\n🛡️ 100% 철저한 비밀 유지와 완벽한 안전 보장까지!\n지금 바로 리자몽몰 티켓 오픈하고 견적 문의하세요!\n👉 https://discord.gg/XphRmaXnVK\n\n@everyone"
          else
            MSG="$INPUT_MSG"
          fi

          # \n을 실제 줄바꿈으로 변환
          MESSAGE=$(printf '%b' "$MSG")

          # JSON 안전하게 생성 후 Discord 웹훅으로 전송
          jq -n \
            --arg content "$MESSAGE" \
            '{
              content: $content,
              allowed_mentions: {
                parse: ["everyone"]
              }
            }' \
          | curl \
              -H "Content-Type: application/json" \
              -X POST \
              --data-binary @- \
              "$WEBHOOK_URL"
